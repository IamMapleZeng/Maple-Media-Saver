plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
def legacyMigrationBridge = providers.gradleProperty('legacyMigrationBridge').orNull == 'true'
android {
    namespace 'io.github.iammaplezeng.xtgytmediasaver'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId legacyMigrationBridge ? 'io.github.iammaplezeng.xtgmediasaver' : 'io.github.iammaplezeng.xtgytmediasaver'
        manifestPlaceholders = [migrationBridgeEnabled: legacyMigrationBridge.toString(), isXposedModule: (!legacyMigrationBridge).toString()]
        minSdk 29
        targetSdk 35
        versionCode 10301
        versionName '1.3.1'
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner 'io.github.iammaplezeng.xtgytmediasaver.SmokeInstrumentation'
    }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '17' }
    packaging {
        jniLibs { useLegacyPackaging true }
        resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST'] }
    }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.grack:nanojson:1.9'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    compileOnly files('libs/xposed-api-82.jar')
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly files('libs/xposed-api-82.jar')
}
